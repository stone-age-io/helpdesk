name: helpdesk
description: "The helpdesk server, in the operator organization. Owns HELPDESK_EVENTS (tickets from managed organizations, through their exports) and HELPDESK_NOTIFICATIONS, and publishes ticket events."
publish_permissions:
  - "helpdesk.*.evt.>"
  - "_INBOX.>"
  - "$JS.API.INFO"
  - "$JS.API.STREAM.*.HELPDESK_EVENTS"
  - "$JS.API.STREAM.MSG.GET.HELPDESK_EVENTS"
  - "$JS.API.CONSUMER.*.HELPDESK_EVENTS"
  - "$JS.API.CONSUMER.*.HELPDESK_EVENTS.>"
  - "$JS.API.CONSUMER.DURABLE.CREATE.HELPDESK_EVENTS.>"
  - "$JS.API.CONSUMER.MSG.NEXT.HELPDESK_EVENTS.>"
  - "$JS.API.DIRECT.GET.HELPDESK_EVENTS.>"
  - "$JS.ACK.HELPDESK_EVENTS.>"
  - "$JS.FC.HELPDESK_EVENTS.>"
  - "$JS.API.STREAM.*.HELPDESK_NOTIFICATIONS"
  - "$JS.API.STREAM.MSG.GET.HELPDESK_NOTIFICATIONS"
  - "$JS.API.CONSUMER.*.HELPDESK_NOTIFICATIONS"
  - "$JS.API.CONSUMER.*.HELPDESK_NOTIFICATIONS.>"
  - "$JS.API.CONSUMER.DURABLE.CREATE.HELPDESK_NOTIFICATIONS.>"
  - "$JS.API.CONSUMER.MSG.NEXT.HELPDESK_NOTIFICATIONS.>"
  - "$JS.API.DIRECT.GET.HELPDESK_NOTIFICATIONS.>"
  - "$JS.ACK.HELPDESK_NOTIFICATIONS.>"
  - "$JS.FC.HELPDESK_NOTIFICATIONS.>"
subscribe_permissions:
  - "_INBOX.>"
  - "$SRV.>"
