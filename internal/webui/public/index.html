<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Service Desk</title>
    <!-- The basemap origin, for the LocationPicker on the location detail form.
         MapLibre does not ask for the style until that route mounts and a
         megabyte of renderer has parsed, so the DNS + TCP + TLS handshake to
         this host is worth starting during the HTML parse instead. crossorigin
         is load-bearing, not decoration: the style, glyphs, sprite and tiles are
         all CORS fetches, and a preconnect without it opens the socket in the
         wrong credentials mode, so nothing reuses it and the handshake happens
         twice. The cost on a visit that never opens a location is one idle
         socket. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
    <!-- PWA: installable shell (manifest + no-op service worker registered in
         main.ts). Matches the sibling platform app's setup. -->
    <link rel="icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4F46E5" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Optional operator branding overlay; served with a silent empty fallback,
         so it's harmless when no overlay is configured. Loaded after the bundled
         DaisyUI CSS so its [data-theme] var overrides win by cascade order. -->
    <link rel="stylesheet" href="/branding/theme.css" />
    <script type="module" crossorigin src="/assets/index-B9xqOb-A.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/pb-sP80B7B8.js">
    <link rel="stylesheet" crossorigin href="/assets/index-CvgllMLZ.css">
  </head>

    <div id="app"></div>
  </body>
</html>
