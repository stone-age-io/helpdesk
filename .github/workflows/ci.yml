name: CI

# Pull requests and the default branch. Tags are deliberately not built here:
# this workflow proves the tree is sound, and cutting a release is a separate
# decision a person makes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch. A force-push or a quick second commit cancels the run it
  # superseded rather than queueing behind it; the suite stands up a real
  # PocketBase per test and is slow enough that the queue would be the thing
  # people notice.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build and tests
    runs-on: ubuntu-latest
    # Each test gets a real PocketBase against t.TempDir() with every migration
    # applied, so the suite is minutes rather than seconds. The default 360 is
    # far too generous for a hung test to sit in.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Read from go.mod, so the toolchain moves in one place.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # `go mod tidy -diff` belongs here and is deliberately absent: on the
      # machine this was written on it reports the whole of go.sum as replaced
      # by byte-identical content in the same order, and a gate nobody can
      # reproduce a green run for is worse than a missing one. Worth adding
      # once someone can explain that locally.

      # -count=1 defeats the test cache. setup-go caches the build cache between
      # runs, and a cached PASS is not a result, it is the memory of one from a
      # commit that may not be this one.
      - name: Test
        run: go test -count=1 ./...

  ui:
    name: SPA builds and matches what is committed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Pinned rather than lts/*, so a Node release cannot change the build
          # without a commit saying so.
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `npm run build` runs vue-tsc first, so this typechecks the SPA as well
      # as bundling it.
      - name: Build the SPA
        run: npm ci && npm run build
        working-directory: ui

      # WHAT THIS DOES NOT DO, AND WHY, BECAUSE TWO ATTEMPTS GOT IT WRONG.
      #
      # It does not compare the committed bundle with the one just built.
      # internal/webui/public is //go:embed-ed and committed so a fresh checkout
      # builds without npm (CLAUDE.md), and that artifact is PLATFORM SPECIFIC:
      # vite 8 builds through rolldown, whose native binding ships per platform,
      # and a Windows build and a Linux build of identical sources differ both
      # in bytes and in the content hashes in the chunk filenames. Comparing
      # bytes failed on a current tree; comparing the chunk set failed the same
      # way, because the hashes differ too. Neither can pass on a runner whose
      # OS is not the one the bundle was committed from, so neither is a check,
      # only a tax.
      #
      # Running this job on windows-latest would make a strict comparison work,
      # at the cost of pinning "who may commit the bundle" to one OS. That is a
      # real option and a deliberate decision, not a default to drift into.
      #
      # What is left is still worth having. The build above runs vue-tsc, so the
      # SPA is typechecked on every push, and the step below catches the failure
      # that actually reaches a user: an index.html referencing chunks that are
      # not committed, which serves a blank page with no error anywhere. That
      # check is a property of the committed tree alone, so it is reliable
      # everywhere.
      - name: Committed bundle is internally consistent
        run: |
          missing=0
          # Every hashed asset index.html pulls in must exist in the commit.
          for ref in $(grep -oE '(src|href)="/assets/[^"]+"' internal/webui/public/index.html | sed -E 's/.*"\/(.*)"/\1/'); do
            if [ ! -f "internal/webui/public/$ref" ]; then
              echo "::error file=internal/webui/public/index.html::references $ref, which is not committed"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "The committed SPA would serve a blank page. Run 'cd ui && npm run build' and commit the whole of internal/webui/public."
            exit 1
          fi
          echo "index.html's $(grep -coE '(src|href)="/assets/[^"]+"' internal/webui/public/index.html) asset reference(s) all resolve."
